<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<style>
body{
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f0f0f0;
}
form{
background:white;
padding:20px;
border-radius:10px;
width:250px;
}
input,button{
width:100%;
padding:10px;
margin:5px 0;
}
button{
background:blue;
color:white;
border:none;
}
</style>
</head>
<body>

<form onsubmit="msg();return false;">
<h2>Registration</h2>

<input type="text" placeholder="Name" required>
<input type="email" placeholder="Email" required>
<input type="password" placeholder="Password" required>

<button>Register</button>

<p id="text"></p>
</form>

<script>
function msg(){
document.getElementById("text").innerHTML="Registered!";
}
</script>

</body>
</html>
